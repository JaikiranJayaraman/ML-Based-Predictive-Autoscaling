version: '3'
services:
  mariadb:
    image: mariadb:10.5
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=prestashop
      - MYSQL_USER=prestashop
      - MYSQL_PASSWORD=prestashop
  prestashop:
    image: prestashop/prestashop:latest
    restart: always
    ports:
      - "80:80"
    links:
      - mariadb:mysql
    depends_on:
      - mariadb
    environment:
      - DB_SERVER=mariadb
      - DB_USER=prestashop
      - DB_PASSWD=prestashop
      - DB_NAME=prestashop
      - PS_DEV_MODE=0
      - PS_INSTALL_AUTO=1
      - PS_DOMAIN=${alb_dns}
