<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Federated Learning Worker Node Status Page">
    <title>Federated Learning Worker Node</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 1s ease-in-out;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        p {
            font-weight: 300;
            opacity: 0.8;
            line-height: 1.6;
        }
        .status {
            display: inline-flex;
            align-items: center;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(0, 255, 127, 0.2);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 127, 0.5);
            font-weight: 600;
            color: #00ff7f;
        }
        .pulse {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff7f;
            box-shadow: 0 0 10px #00ff7f;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 127, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 127, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 127, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Federated Learning Node</h1>
        <p>This EC2 instance is actively participating in the federated training network. It fetches model updates, trains locally using targeted data sources, and pushes gradients back to the central aggregator securely and automatically.</p>
        <div class="status">
            <div class="pulse"></div> System Online & Active
        </div>
    </div>
</body>
</html>
